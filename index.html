<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Slide Deck</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .presentation-container {
            background: #2a2a40;
            border-radius: 32px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 900px;
            padding: 24px 24px 32px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .slide-counter {
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a9a9d0;
            margin-bottom: 16px;
            font-weight: 500;
            background: #1e1e2f;
            padding: 6px 12px;
            border-radius: 60px;
            display: inline-block;
            align-self: center;
            backdrop-filter: blur(4px);
        }
        .slide-view {
            background: #0e0e17;
            border-radius: 24px;
            padding: 32px 28px;
            margin-bottom: 24px;
            min-height: 380px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 6px 14px rgba(0, 0, 0, 0.4);
            border: 1px solid #3b3b5c;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
        }
        .slide-content {
            flex: 1;
            color: #e8e8ff;
            font-size: 1.1rem;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 460px;
            padding-right: 6px;
            scrollbar-width: thin;
            scrollbar-color: #5d5d8a #1a1a2a;
        }
        .slide-content::-webkit-scrollbar {
            width: 6px;
        }
        .slide-content::-webkit-scrollbar-track {
            background: #1a1a2a;
            border-radius: 10px;
        }
        .slide-content::-webkit-scrollbar-thumb {
            background: #5d5d8a;
            border-radius: 10px;
        }
        /* JSON tree styling */
        .json-tree {
            font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
            font-size: 0.95rem;
            background: #13131f;
            border-radius: 16px;
            padding: 20px 18px;
            border: 1px solid #3b3b5c;
            white-space: pre-wrap;
            word-break: break-word;
            color: #d4d4f0;
        }
        .json-key {
            color: #7aa2f7;
            font-weight: 500;
        }
        .json-string {
            color: #9ece6a;
        }
        .json-number {
            color: #ff9e64;
        }
        .json-boolean {
            color: #bb9af7;
        }
        .json-null {
            color: #f7768e;
        }
        .json-bracket {
            color: #7dcfff;
        }
        .empty-state {
            color: #6b6b8f;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2rem;
            background: #13131f;
            border-radius: 16px;
            border: 1px dashed #4a4a6e;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #2f2f4a;
            border: none;
            color: #dbdbff;
            font-size: 1.2rem;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 8px 0 #12121e, 0 6px 14px rgba(0, 0, 0, 0.4);
            border: 1px solid #5a5a8a;
            letter-spacing: 0.3px;
            min-width: 110px;
        }
        .nav-btn:hover:not(:disabled) {
            background: #3d3d62;
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #12121e, 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        .nav-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #12121e, 0 6px 14px rgba(0, 0, 0, 0.4);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #12121e, 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .slide-indicator {
            color: #b0b0e0;
            font-size: 1rem;
            font-weight: 500;
            background: #1a1a2a;
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #3e3e62;
            min-width: 110px;
            text-align: center;
        }
        .status-message {
            text-align: center;
            margin-top: 16px;
            color: #9b9bcb;
            font-size: 0.9rem;
            min-height: 1.5em;
        }
        .error-message {
            color: #f7768e;
            background: #2a1a2a;
            padding: 12px 18px;
            border-radius: 16px;
            border-left: 4px solid #f7768e;
        }
        h2 {
            font-weight: 400;
            font-size: 1.2rem;
            margin-bottom: 18px;
            color: #b4b4e0;
            border-bottom: 1px solid #35355b;
            padding-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 14px;
            justify-content: center;
        }
        .file-badge {
            background: #25253e;
            color: #c0c0f0;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-family: monospace;
            border: 1px solid #3f3f6b;
        }
    </style>
</head>
<body>
<div class="presentation-container">
    <div class="slide-counter" id="slideCounter">Slide 1 / 0</div>
    <div class="slide-view">
        <div class="slide-content" id="slideContent">
            <div class="empty-state">📂 Loading JSON files from /levels ...</div>
        </div>
    </div>
    <div class="controls">
        <button class="nav-btn" id="prevBtn" disabled>◀ Prev</button>
        <div class="slide-indicator" id="slideIndicator">1 / 0</div>
        <button class="nav-btn" id="nextBtn" disabled>Next ▶</button>
    </div>
    <div class="status-message" id="statusMessage"></div>
    <div class="file-list" id="fileList"></div>
</div>
<script>
    (function() {
        // --- configuration ---
        const LEVELS_DIR = 'levels';
        const MAX_SLIDES = 50;      // safety limit, won't try more than this
        const FILE_NAMES = [];       // will hold loaded file names

        // --- state ---
        let slides = [];             // each slide: { name: string, data: any }
        let currentSlide = 0;        // zero-based index
        let isLoading = false;

        // --- DOM elements ---
        const slideContent = document.getElementById('slideContent');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideIndicator = document.getElementById('slideIndicator');
        const slideCounter = document.getElementById('slideCounter');
        const statusMessage = document.getElementById('statusMessage');
        const fileListEl = document.getElementById('fileList');

        // --- helper: render a JSON object as a fancy tree (string with spans) ---
        function renderJsonToHtml(obj, indentLevel = 0) {
            const indent = '  '.repeat(indentLevel);
            const nextIndent = '  '.repeat(indentLevel + 1);

            // Handle primitives
            if (obj === null) return `<span class="json-null">null</span>`;
            if (typeof obj === 'string') return `<span class="json-string">"${escapeHtml(obj)}"</span>`;
            if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
            if (typeof obj === 'boolean') return `<span class="json-boolean">${obj}</span>`;
            if (obj === undefined) return `<span class="json-null">undefined</span>`;

            // Array
            if (Array.isArray(obj)) {
                if (obj.length === 0) return `<span class="json-bracket">[]</span>`;
                let items = obj.map(item => {
                    return `${nextIndent}${renderJsonToHtml(item, indentLevel + 1)}`;
                }).join(',\n');
                return `<span class="json-bracket">[</span>\n${items}\n${indent}<span class="json-bracket">]</span>`;
            }

            // Object
            if (typeof obj === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) return `<span class="json-bracket">{}</span>`;
                let entries = keys.map(key => {
                    const value = obj[key];
                    return `${nextIndent}<span class="json-key">"${escapeHtml(key)}"</span>: ${renderJsonToHtml(value, indentLevel + 1)}`;
                }).join(',\n');
                return `<span class="json-bracket">{</span>\n${entries}\n${indent}<span class="json-bracket">}</span>`;
            }

            return `<span class="json-null">[unknown]</span>`;
        }

        // simple escape for HTML
        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // render slide content based on current index
        function renderSlide() {
            if (!slides.length) {
                slideContent.innerHTML = `<div class="empty-state">📭 No slides loaded. Make sure a <strong>levels</strong> folder exists with 1.json, 2.json, etc.</div>`;
                updateUI();
                return;
            }

            const slide = slides[currentSlide];
            // Wrap the JSON tree in a container for styling
            const jsonHtml = renderJsonToHtml(slide.data, 0);
            slideContent.innerHTML = `<div class="json-tree">${jsonHtml}</div>`;
            // show file name in status (optional)
            statusMessage.textContent = `📄 ${slide.name}`;
            updateUI();
        }

        // update buttons, indicators, counter
        function updateUI() {
            const total = slides.length;
            if (total === 0) {
                slideIndicator.textContent = `0 / 0`;
                slideCounter.textContent = `Slide 0 / 0`;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            const currentDisplay = currentSlide + 1;
            slideIndicator.textContent = `${currentDisplay} / ${total}`;
            slideCounter.textContent = `Slide ${currentDisplay} / ${total}`;
            prevBtn.disabled = (currentSlide === 0);
            nextBtn.disabled = (currentSlide === total - 1);
        }

        // change slide by offset
        function navigate(delta) {
            if (!slides.length) return;
            const newIndex = currentSlide + delta;
            if (newIndex < 0 || newIndex >= slides.length) return;
            currentSlide = newIndex;
            renderSlide();
        }

        // reset/clear all slides
        function clearSlides() {
            slides = [];
            FILE_NAMES.length = 0;
            currentSlide = 0;
        }

        // add a slide (if valid)
        function addSlide(name, data) {
            if (data === undefined) return;
            slides.push({ name, data });
            FILE_NAMES.push(name);
        }

        // update file list badges
        function updateFileBadges() {
            if (FILE_NAMES.length === 0) {
                fileListEl.innerHTML = '';
                return;
            }
            fileListEl.innerHTML = FILE_NAMES.map(f => `<span class="file-badge">${escapeHtml(f)}</span>`).join('');
        }

        // ---- fetch JSON files from levels/1.json, 2.json, ... ----
        async function loadAllJsonFiles() {
            if (isLoading) return;
            isLoading = true;
            clearSlides();
            slideContent.innerHTML = `<div class="empty-state">⏳ Loading JSON files from /levels ...</div>`;
            statusMessage.textContent = 'Fetching files...';
            updateUI();
            fileListEl.innerHTML = '';

            let consecutiveFailures = 0;
            const MAX_CONSECUTIVE_FAILURES = 3; // stop after 3 failures in a row

            // loop from 1 to MAX_SLIDES
            for (let i = 1; i <= MAX_SLIDES; i++) {
                const fileName = `${i}.json`;
                const url = `${LEVELS_DIR}/${fileName}`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        // file not found or other HTTP error
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    addSlide(fileName, data);
                    consecutiveFailures = 0; // reset on success
                    // update status while loading
                    statusMessage.textContent = `Loaded ${fileName} (${slides.length} slides)`;
                } catch (error) {
                    // silent fail for missing file, but count consecutive failures
                    consecutiveFailures++;
                    // if we've had too many failures in a row, stop trying
                    if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) {
                        console.warn(`Stopped after ${MAX_CONSECUTIVE_FAILURES} consecutive missing files. Last tried: ${fileName}`);
                        break;
                    }
                    // else continue to next number
                }
            }

            // after loop: finalize
            if (slides.length > 0) {
                currentSlide = 0;
                renderSlide();
                statusMessage.textContent = `✅ Loaded ${slides.length} slide(s)`;
            } else {
                // no slides found
                slideContent.innerHTML = `<div class="empty-state">⚠️ No JSON slides found.<br>Place 1.json, 2.json, ... inside a <strong>levels</strong> folder next to index.html.</div>`;
                statusMessage.textContent = `No files loaded.`;
                updateUI();
            }
            updateFileBadges();
            isLoading = false;
        }

        // ---- event listeners ----
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        // keyboard navigation (left/right arrows)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                navigate(-1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                navigate(1);
            }
        });

        // ---- start loading when page is ready ----
        window.addEventListener('load', () => {
            loadAllJsonFiles();
        });

        // optional: if user wants to reload (not exposed as button, but could be)
        // for debugging: window.reloadSlides = loadAllJsonFiles;
    })();
</script>
</body>
</html>
