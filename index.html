<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Slide Deck</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .presentation-container {
            background: #2a2a40;
            border-radius: 32px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 1000px;
            padding: 24px 24px 32px;
            display: flex;
            flex-direction: column;
        }
        .slide-counter {
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a9a9d0;
            margin-bottom: 16px;
            font-weight: 500;
            background: #1e1e2f;
            padding: 6px 16px;
            border-radius: 60px;
            display: inline-block;
            align-self: center;
        }
        .slide-view {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 40px;
            margin-bottom: 24px;
            min-height: 480px;
            max-height: 70vh;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #3b3b5c;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .slide-content {
            flex: 1;
            color: #1a1a2a;
            font-size: 1rem;
            line-height: 1.65;
            overflow-y: auto;
            padding-right: 12px;
            scrollbar-width: thin;
            scrollbar-color: #8a8ab0 #e8e8f0;
            white-space: pre-wrap;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .slide-content::-webkit-scrollbar { width: 8px; }
        .slide-content::-webkit-scrollbar-track { background: #e8e8f0; border-radius: 10px; }
        .slide-content::-webkit-scrollbar-thumb { background: #8a8ab0; border-radius: 10px; }

        /* Text rendering */
        .slide-content .line { display: block; }
        .slide-content .header {
            font-weight: 700;
            color: #1a1a5e;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 1.15rem;
            border-bottom: 1px solid #d0d0e8;
            padding-bottom: 2px;
        }
        .slide-content .subheader {
            font-weight: 600;
            color: #2a2a6a;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 1.05rem;
        }
        .slide-content .numbered-header {
            font-weight: 700;
            color: #1a1a5e;
            margin-top: 20px;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }
        .slide-content .numbered-header:first-child { margin-top: 0; }
        .slide-content .bullet {
            display: block;
            padding-left: 22px;
            text-indent: -14px;
            margin: 3px 0;
        }
        .slide-content .bullet::before {
            content: "• ";
            color: #4a4a9a;
            font-weight: 700;
        }
        .slide-content .sub-bullet {
            display: block;
            padding-left: 44px;
            text-indent: -12px;
            margin: 2px 0;
            color: #3a3a5a;
        }
        .slide-content .sub-bullet::before {
            content: "◦ ";
            color: #6a6aaa;
        }
        .slide-content .sub-sub-bullet {
            display: block;
            padding-left: 66px;
            text-indent: -12px;
            margin: 2px 0;
            color: #4a4a6a;
            font-size: 0.95rem;
        }
        .slide-content .sub-sub-bullet::before {
            content: "▪ ";
            color: #8a8aba;
        }
        .slide-content .numbered-item {
            display: block;
            padding-left: 26px;
            text-indent: -18px;
            margin: 4px 0;
        }
        .slide-content .numbered-item::before {
            content: attr(data-num) ". ";
            color: #4a4a9a;
            font-weight: 700;
        }
        .slide-content .paragraph {
            margin: 6px 0;
            display: block;
        }
        .slide-content .note {
            font-style: italic;
            color: #7a7a9a;
            display: block;
            margin: 8px 0;
            padding: 6px 10px;
            background: #f0f0f8;
            border-radius: 8px;
            border-left: 3px solid #a0a0d0;
        }
        .slide-content .empty-line {
            display: block;
            height: 8px;
        }

        .empty-state {
            color: #6b6b8f;
            font-style: italic;
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2rem;
            background: #f8f8fc;
            border-radius: 16px;
            border: 1px dashed #c0c0d8;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #2f2f4a;
            border: none;
            color: #dbdbff;
            font-size: 1.2rem;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 8px 0 #12121e, 0 6px 14px rgba(0, 0, 0, 0.4);
            border: 1px solid #5a5a8a;
            min-width: 120px;
        }
        .nav-btn:hover:not(:disabled) {
            background: #3d3d62;
            transform: translateY(-2px);
        }
        .nav-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #12121e;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #12121e;
        }
        .slide-indicator {
            color: #b0b0e0;
            font-size: 1rem;
            font-weight: 500;
            background: #1a1a2a;
            padding: 10px 22px;
            border-radius: 60px;
            border: 1px solid #3e3e62;
            min-width: 110px;
            text-align: center;
        }
        .status-message {
            text-align: center;
            margin-top: 16px;
            color: #9b9bcb;
            font-size: 0.9rem;
            min-height: 1.5em;
        }
        .file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-top: 12px;
            justify-content: center;
        }
        .file-badge {
            background: #25253e;
            color: #c0c0f0;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-family: monospace;
            border: 1px solid #3f3f6b;
        }
        .file-badge.active {
            background: #4a4a9a;
            color: #ffffff;
            border-color: #8a8aff;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="presentation-container">
    <div class="slide-counter" id="slideCounter">Slide 0 / 0</div>
    <div class="slide-view">
        <div class="slide-content" id="slideContent">
            <div class="empty-state">📂 Loading TXT files from /levels ...</div>
        </div>
    </div>
    <div class="controls">
        <button class="nav-btn" id="prevBtn" disabled>◀ Prev</button>
        <div class="slide-indicator" id="slideIndicator">0 / 0</div>
        <button class="nav-btn" id="nextBtn" disabled>Next ▶</button>
    </div>
    <div class="status-message" id="statusMessage"></div>
    <div class="file-list" id="fileList"></div>

    <div style="text-align:center; margin-top:24px;">
    <a href="zombie-game.html"
       style="display:inline-block;
              background:#1a3a1a;
              border:2px solid #4aff8a;
              color:#4aff8a;
              padding:16px 36px;
              border-radius:60px;
              text-decoration:none;
              font-weight:700;
              font-size:1.1rem;
              letter-spacing:1px;
              box-shadow:0 0 20px rgba(74,255,138,0.2);">
        🧟 Test Your Knowledge — Play the Zombie Shooter
    </a>
</div>
    
</div>
    
<script>
(function () {
    const LEVELS_DIR = 'levels';
    const MAX_SLIDES = 100;
    const MAX_CONSECUTIVE_FAILURES = 3;

    let slides = [];       // { name, rawText }
    let currentSlide = 0;
    let isLoading = false;

    const slideContent = document.getElementById('slideContent');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideIndicator = document.getElementById('slideIndicator');
    const slideCounter = document.getElementById('slideCounter');
    const statusMessage = document.getElementById('statusMessage');
    const fileListEl = document.getElementById('fileList');

    // ---------- Text formatting engine ----------

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // Detect a "header" line: uppercase-ish title line, all caps, or numbered section like "1. FOO"
    function classifyLine(rawLine) {
        const line = rawLine.replace(/\s+$/, '');
        if (!line.trim()) return { type: 'empty', raw: '' };

        const trimmed = line.trim();

        // Notes: parenthetical italic notes like "(Note: ...)"
        if (/^\(Note:/i.test(trimmed) || /^Note:/i.test(trimmed)) {
            return { type: 'note', raw: line };
        }

        // Numbered section header: "1. GENERAL CLINICAL..." or "2. SPECIFIC..."
        if (/^\d+\.\s+[A-Z][A-Z0-9 &\-–—/,()']+$/.test(trimmed) && trimmed.length > 8) {
            return { type: 'numbered-header', raw: line };
        }

        // ALL-CAPS header (no trailing colon, length reasonable)
        if (/^[A-Z][A-Z0-9 &\-–—/,()'.:!?]+$/.test(trimmed) && trimmed.length > 3 && /[A-Z]{2,}/.test(trimmed)) {
            return { type: 'header', raw: line };
        }

        // Sub-header ending with colon like "Etiology & Transmission:" or "Clinical Findings:"
        if (/^[A-Z][^.!?]*:$/.test(trimmed) && trimmed.length < 80) {
            return { type: 'subheader', raw: line };
        }

        // Sub-bullet with tab + bullet char "	• "
        if (/^\t+[•◦▪\-]/.test(line) || /^ {4,}[•◦▪\-]/.test(line)) {
            const indentLevel = (line.match(/^\t+/)?.[0].length || Math.floor((line.match(/^ +/)?.[0].length || 0) / 2));
            return { type: 'sub-bullet', raw: line, level: Math.min(indentLevel, 2) };
        }

        // Bullet: starts with "•"
        if (/^\s*•/.test(line)) {
            return { type: 'bullet', raw: line };
        }

        // Numbered item: "1. Breakdown..." but also "2. In hepatocytes..."
        if (/^\d+\.\s/.test(trimmed)) {
            const num = trimmed.match(/^(\d+)\./)[1];
            return { type: 'numbered-item', raw: line, num };
        }

        // Default: paragraph
        return { type: 'paragraph', raw: line };
    }

    function renderText(text) {
        // Normalize line endings
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        const out = [];

        for (let i = 0; i < lines.length; i++) {
            const info = classifyLine(lines[i]);
            const raw = info.raw;
            const trimmed = raw.trim();

            switch (info.type) {
                case 'empty':
                    out.push('<span class="empty-line"></span>');
                    break;
                case 'header':
                    out.push(`<span class="header">${escapeHtml(trimmed)}</span>`);
                    break;
                case 'numbered-header':
                    out.push(`<span class="numbered-header">${escapeHtml(trimmed)}</span>`);
                    break;
                case 'subheader':
                    out.push(`<span class="subheader">${escapeHtml(trimmed)}</span>`);
                    break;
                case 'note':
                    out.push(`<span class="note">${escapeHtml(trimmed)}</span>`);
                    break;
                case 'bullet': {
                    const content = trimmed.replace(/^[•◦▪\-]\s*/, '');
                    out.push(`<span class="bullet">${escapeHtml(content)}</span>`);
                    break;
                }
                case 'sub-bullet': {
                    const content = trimmed.replace(/^[•◦▪\-]\s*/, '');
                    if (info.level >= 2) {
                        out.push(`<span class="sub-sub-bullet">${escapeHtml(content)}</span>`);
                    } else {
                        out.push(`<span class="sub-bullet">${escapeHtml(content)}</span>`);
                    }
                    break;
                }
                case 'numbered-item': {
                    const content = trimmed.replace(/^\d+\.\s*/, '');
                    out.push(`<span class="numbered-item" data-num="${info.num}">${escapeHtml(content)}</span>`);
                    break;
                }
                default:
                    out.push(`<span class="paragraph">${escapeHtml(trimmed)}</span>`);
            }
        }

        return out.join('\n');
    }

    // ---------- Slide rendering ----------

    function renderSlide() {
        if (!slides.length) {
            slideContent.innerHTML = `<div class="empty-state">📭 No slides loaded. Make sure a <strong>levels</strong> folder exists with 1.txt, 2.txt, etc.</div>`;
            updateUI();
            return;
        }

        const slide = slides[currentSlide];
        slideContent.innerHTML = renderText(slide.rawText);
        statusMessage.textContent = `📄 ${slide.name}`;
        updateUI();
        updateFileBadges();
    }

    function updateUI() {
        const total = slides.length;
        if (total === 0) {
            slideIndicator.textContent = '0 / 0';
            slideCounter.textContent = 'Slide 0 / 0';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }
        const cur = currentSlide + 1;
        slideIndicator.textContent = `${cur} / ${total}`;
        slideCounter.textContent = `Slide ${cur} / ${total}`;
        prevBtn.disabled = currentSlide === 0;
        nextBtn.disabled = currentSlide === total - 1;
    }

    function navigate(delta) {
        if (!slides.length) return;
        const next = currentSlide + delta;
        if (next < 0 || next >= slides.length) return;
        currentSlide = next;
        renderSlide();
    }

    function updateFileBadges() {
        if (!slides.length) { fileListEl.innerHTML = ''; return; }
        fileListEl.innerHTML = slides.map((s, idx) =>
            `<span class="file-badge${idx === currentSlide ? ' active' : ''}">${escapeHtml(s.name)}</span>`
        ).join('');
    }

    // ---------- Loading ----------

    async function loadAllFiles() {
        if (isLoading) return;
        isLoading = true;
        slides = [];
        currentSlide = 0;

        slideContent.innerHTML = `<div class="empty-state">⏳ Loading files from /levels ...</div>`;
        statusMessage.textContent = 'Fetching files...';
        updateUI();
        fileListEl.innerHTML = '';

        let consecutiveFailures = 0;

        for (let i = 1; i <= MAX_SLIDES; i++) {
            const fileName = `${i}.txt`;
            const url = `${LEVELS_DIR}/${fileName}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const rawText = await res.text();
                slides.push({ name: fileName, rawText });
                consecutiveFailures = 0;
                statusMessage.textContent = `Loaded ${fileName} (${slides.length} slide${slides.length > 1 ? 's' : ''})`;
            } catch (err) {
                consecutiveFailures++;
                if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) break;
            }
        }

        if (slides.length > 0) {
            currentSlide = 0;
            renderSlide();
            statusMessage.textContent = `✅ Loaded ${slides.length} slide${slides.length > 1 ? 's' : ''}`;
        } else {
            slideContent.innerHTML = `<div class="empty-state">⚠️ No text slides found.<br>Place 1.txt, 2.txt, ... inside a <strong>levels</strong> folder next to index.html.</div>`;
            statusMessage.textContent = 'No files loaded.';
            updateUI();
        }
        updateFileBadges();
        isLoading = false;
    }

    // ---------- Events ----------
    prevBtn.addEventListener('click', () => navigate(-1));
    nextBtn.addEventListener('click', () => navigate(1));
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault(); navigate(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1); }
    });

    window.addEventListener('load', loadAllFiles);
})();
</script>
</body>
</html>
