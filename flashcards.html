<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Learning Flashcards</title>
    <style>
        :root {
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
        }

        #flashcards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .flashcard {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e1e8ed;
        }

        .flashcard:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .flashcard-header {
            background-color: var(--accent-color);
            color: white;
            padding: 15px;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
        }

        .flashcard-body {
            padding: 20px;
            line-height: 1.6;
        }

        .flashcard-body p {
            margin: 0;
        }

        /* Simple loading indicator */
        .flashcard-body p:empty::before {
            content: "Summarizing...";
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Active Learning Flashcards</h1>
        <p>Loading your study materials...</p>
        <div id="flashcards-container"></div>
    </div>

    <script>
        // Configuration
        const HUGGINGFACE_API_URL = "https://api-inference.huggingface.co/models/Falconsai/text_summarization";
        const LEVELS_FOLDER = "levels/";
        
        // IMPORTANT: The Hugging Face free API has rate limits. 
        // For heavy usage, sign up at huggingface.co, get a free Access Token,
        // and add it to the headers object below.
        const API_HEADERS = {
            "Content-Type": "application/json",
            // "Authorization": "Bearer YOUR_HF_TOKEN_HERE" 
        };

        // Function to fetch and summarize text using Hugging Face
        async function generateFlashcard(text) {
            try {
                const payload = {
                    "inputs": text,
                    "parameters": {
                        "max_length": 120,
                        "min_length": 30,
                        "do_sample": false
                    }
                };

                const response = await fetch(HUGGINGFACE_API_URL, {
                    method: "POST",
                    headers: API_HEADERS,
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("API Error:", errorData);
                    // Fallback if API fails: just truncate the text
                    return text.substring(0, 200) + "...";
                }

                const data = await response.json();
                return data[0].summary_text;
            } catch (error) {
                console.error("Fetch Error:", error);
                return "Failed to generate summary.";
            }
        }

        // Function to load text files and create flashcards
        async function loadFlashcards() {
            const container = document.getElementById('flashcards-container');
            container.innerHTML = '<p>Processing files with AI...</p>';

            const files = ['1.txt', '2.txt', '3.txt']; 
            const flashcards = [];

            for (const fileName of files) {
                try {
                    const response = await fetch(LEVELS_FOLDER + fileName);
                    const rawText = await response.text();

                    const summary = await generateFlashcard(rawText);

                    flashcards.push({
                        title: `Lesson: ${fileName.replace('.txt', '')}`,
                        content: summary
                    });

                } catch (error) {
                    console.error(`Could not load ${fileName}:`, error);
                    flashcards.push({
                        title: `Lesson: ${fileName}`,
                        content: "Error loading this file."
                    });
                }
            }

            renderFlashcards(flashcards);
        }

        // Function to render the flashcards in the DOM
        function renderFlashcards(cards) {
            const container = document.getElementById('flashcards-container');
            container.innerHTML = ''; 

            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'flashcard';
                
                cardElement.innerHTML = `
                    <div class="flashcard-header">
                        <h3>${card.title}</h3>
                    </div>
                    <div class="flashcard-body">
                        <p>${card.content}</p>
                    </div>
                `;
                container.appendChild(cardElement);
            });
        }

        document.addEventListener('DOMContentLoaded', loadFlashcards);
    </script>
</body>
</html>
